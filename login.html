<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Therapist login portal — Rewire With Kajal." />
  <title>Login | Rewire With Kajal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/main-from-app.css" />
  <link rel="stylesheet" href="css/site-overrides.css" />
  <link rel="icon" type="image/png" href="images/logo3.png" />
  <noscript>
    <style>
      .rw-reveal {
        opacity: 1 !important;
        transform: none !important;
      }
    </style>
  </noscript>
</head>

<body class="rw-site-bg-lines">
  <div style="margin-top: 5rem;"></div>
  <div class="rw-site-line-art" aria-hidden="true">
    <div class="rw-site-line-art__float">
      <svg class="rw-site-line-art__svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"
        preserveAspectRatio="xMidYMid slice" focusable="false">
        <defs>
          <linearGradient id="rw-site-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(249, 115, 22, 0.09)" />
            <stop offset="45%" stop-color="rgba(249, 115, 22, 0.16)" />
            <stop offset="100%" stop-color="rgba(249, 115, 22, 0.07)" />
          </linearGradient>
        </defs>
        <path class="rw-site-line-art__path rw-site-line-art__path--1" fill="none" stroke="url(#rw-site-orange-grad)"
          stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"
          d="M 32 168 C 32 78 118 42 228 72 C 338 102 372 196 308 278 C 244 360 118 348 76 268 C 48 218 32 198 32 168" />
        <path class="rw-site-line-art__path rw-site-line-art__path--2" fill="none" stroke="rgba(249, 115, 22, 0.13)"
          stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"
          d="M 468 52 C 612 8 792 36 892 118 C 992 200 968 292 862 332 C 756 372 628 328 564 248 C 508 178 468 128 468 52" />
        <path class="rw-site-line-art__path rw-site-line-art__path--3" fill="none" stroke="rgba(249, 115, 22, 0.11)"
          stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
          d="M 128 88 C 268 12 396 28 528 96 C 652 158 592 212 484 232 C 388 250 268 198 196 128 C 158 92 138 82 128 88" />
        <path class="rw-site-line-art__path rw-site-line-art__path--4" fill="none" stroke="rgba(249, 115, 22, 0.12)"
          stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"
          d="M 636 198 C 712 128 824 152 868 228 C 912 304 836 372 748 372 C 660 372 584 308 604 236 C 616 198 628 192 636 198" />
        <path class="rw-site-line-art__path rw-site-line-art__path--5" fill="none" stroke="rgba(249, 115, 22, 0.09)"
          stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round"
          d="M 88 412 C 276 348 484 432 712 384 C 928 338 1088 408 1168 364 C 1192 350 1196 346 1196 346" />
      </svg>
      <span class="rw-site-line-art__orb rw-site-line-art__orb--1"></span>
      <span class="rw-site-line-art__orb rw-site-line-art__orb--2"></span>
      <span class="rw-site-line-art__orb rw-site-line-art__orb--3"></span>
    </div>
  </div>

  <main class="abt2-wrapper" id="main-content">
    <section class="rw-section rw-appointment-section rw-reveal">
      <header class="rw-section-head rw-center">
        <p class="rw-kicker">Portal</p>
        <h2>Therapist <span>Login</span></h2>
        <p class="rw-section-desc">Access the secure admin dashboard to review patient forms and appointment requests.</p>
      </header>
      <form class="ra-form-card ra-form-card--compact rw-appointment-section" id="loginForm" novalidate>
        <div class="ra-form-group">
          <label class="ra-form-label" for="login-username">Username or Email</label>
          <input class="ra-form-input" id="login-username" name="username" type="text" required autocomplete="username" />
        </div>
        <div class="ra-form-group">
          <label class="ra-form-label" for="login-password">Password</label>
          <input class="ra-form-input" id="login-password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <p id="login-fb" class="ra-form-alert success" role="status" hidden></p>
        <button type="submit" class="ra-btn-submit">Login</button>
        <div class="text-center mt-3">
          <a href="index.html" style="color: #00373e; font-size: 0.88rem; text-decoration: none; font-weight: 500; opacity: 0.8; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.8'">← Back to Website</a>
        </div>
      </form>
    </section>
  </main>

  <div style="margin-bottom: 5rem;"></div>

  <script src="js/common.js"></script>
  <script>
    (function () {
      var f = document.getElementById("loginForm");
      var fb = document.getElementById("login-fb");

      function showFormValidationErrors() {
        f.classList.add("was-validated");
        f.querySelectorAll(".invalid-feedback-custom").forEach(function (el) {
          el.remove();
        });
        
        var invalidFields = f.querySelectorAll(":invalid");
        invalidFields.forEach(function (field) {
          if (field.type === "hidden" || field.tagName === "BUTTON") return;
          
          var parent = field.closest(".ra-form-group");
          if (parent) {
            var errorDiv = document.createElement("div");
            errorDiv.className = "invalid-feedback-custom";
            errorDiv.style.color = "#d32f2f";
            errorDiv.style.fontSize = "0.78rem";
            errorDiv.style.marginTop = "0.35rem";
            errorDiv.style.fontFamily = "var(--font-body)";
            errorDiv.textContent = field.validationMessage || "This field is required.";
            parent.appendChild(errorDiv);
          }
        });
      }

      f.addEventListener("input", function (e) {
        if (f.classList.contains("was-validated")) {
          var field = e.target;
          if (field.checkValidity()) {
            var parent = field.closest(".ra-form-group");
            if (parent) {
              var err = parent.querySelector(".invalid-feedback-custom");
              if (err) err.remove();
            }
          }
        }
      });

      if (f && fb) {
        f.addEventListener("submit", function (e) {
          e.preventDefault();

          if (!f.checkValidity()) {
            showFormValidationErrors();
            return;
          }

          var formData = new FormData(f);
          fb.hidden = false;
          fb.className = "ra-form-alert";
          fb.style.backgroundColor = "rgba(0, 55, 62, 0.05)";
          fb.style.color = "#00373e";
          fb.textContent = "Authenticating...";

          fetch("api/login.php", {
            method: "POST",
            body: formData
          })
            .then(function (response) {
              return response.json();
            })
            .then(function (data) {
              fb.removeAttribute("style");
              if (data.success) {
                fb.className = "ra-form-alert success";
                fb.textContent = "Success! Redirecting to dashboard...";
                f.reset();
                f.classList.remove("was-validated");
                f.querySelectorAll(".invalid-feedback-custom").forEach(function (el) {
                  el.remove();
                });
                setTimeout(function () {
                  window.location.href = "admin/index.php";
                }, 1000);
              } else {
                fb.className = "ra-form-alert error";
                fb.textContent = data.error || "Invalid username or password.";
              }
            })
            .catch(function (err) {
              fb.removeAttribute("style");
              fb.className = "ra-form-alert error";
              fb.textContent = "Network error. Please check your connection and try again.";
            });
        });
      }
    })();
  </script>
</body>

</html>
