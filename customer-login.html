<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Client login — Rewire With Kajal." />
  <title>Client Login | Rewire With Kajal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/main-from-app.css" />
  <link rel="stylesheet" href="css/site-overrides.css" />
  <link rel="icon" type="image/png" href="images/logo3.png" />
  <noscript>
    <style>
      .rw-reveal {
        opacity: 1 !important;
        transform: none !important;
      }
    </style>
  </noscript>
<style>
    html, body.rw-login-page { background: #f7f6f4; }
    body.rw-login-page > .rw-site-line-art { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    body.rw-login-page .abt2-wrapper,
    body.rw-login-page .rw-appointment-section,
    body.rw-login-page .rw-section.rw-appointment-section { background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; position: relative; z-index: 1; }
  </style>
</head>

<body class="rw-site-bg-lines rw-login-page">
  <div style="margin-top: 5rem;"></div>
  <div class="rw-site-line-art" aria-hidden="true">
    <div class="rw-site-line-art__float">
      <svg class="rw-site-line-art__svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"
        preserveAspectRatio="xMidYMid slice" focusable="false">
        <defs>
          <linearGradient id="rw-site-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(249, 115, 22, 0.09)" />
            <stop offset="45%" stop-color="rgba(249, 115, 22, 0.16)" />
            <stop offset="100%" stop-color="rgba(249, 115, 22, 0.07)" />
          </linearGradient>
        </defs>
        <path class="rw-site-line-art__path rw-site-line-art__path--1" fill="none" stroke="url(#rw-site-orange-grad)"
          stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"
          d="M 32 168 C 32 78 118 42 228 72 C 338 102 372 196 308 278 C 244 360 118 348 76 268 C 48 218 32 198 32 168" />
        <path class="rw-site-line-art__path rw-site-line-art__path--2" fill="none" stroke="rgba(249, 115, 22, 0.13)"
          stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"
          d="M 468 52 C 612 8 792 36 892 118 C 992 200 968 292 862 332 C 756 372 628 328 564 248 C 508 178 468 128 468 52" />
        <path class="rw-site-line-art__path rw-site-line-art__path--3" fill="none" stroke="rgba(249, 115, 22, 0.11)"
          stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
          d="M 128 88 C 268 12 396 28 528 96 C 652 158 592 212 484 232 C 388 250 268 198 196 128 C 158 92 138 82 128 88" />
        <path class="rw-site-line-art__path rw-site-line-art__path--4" fill="none" stroke="rgba(249, 115, 22, 0.12)"
          stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"
          d="M 636 198 C 712 128 824 152 868 228 C 912 304 836 372 748 372 C 660 372 584 308 604 236 C 616 198 628 192 636 198" />
        <path class="rw-site-line-art__path rw-site-line-art__path--5" fill="none" stroke="rgba(249, 115, 22, 0.09)"
          stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round"
          d="M 88 412 C 276 348 484 432 712 384 C 928 338 1088 408 1168 364 C 1192 350 1196 346 1196 346" />
      </svg>
      <span class="rw-site-line-art__orb rw-site-line-art__orb--1"></span>
      <span class="rw-site-line-art__orb rw-site-line-art__orb--2"></span>
      <span class="rw-site-line-art__orb rw-site-line-art__orb--3"></span>
    </div>
  </div>

  <main class="abt2-wrapper" id="main-content">
    <section class="rw-section rw-appointment-section rw-reveal">
      <header class="rw-section-head rw-center">
        <p class="rw-kicker">Portal</p>
        <h2>Client <span>Login</span></h2>
        <p class="rw-section-desc">Sign in to view your sessions and appointments.</p>
      </header>
      <form class="ra-form-card ra-form-card--compact rw-appointment-section" id="customerLoginForm" novalidate>
        <div id="cl-step-email">
          <div class="ra-form-group">
            <label class="ra-form-label" for="cl-email">Email</label>
            <input class="ra-form-input" id="cl-email" type="email" required autocomplete="email" />
          </div>
        </div>
        <div id="cl-step-code" hidden>
          <p class="rw-section-desc" id="cl-sent" style="margin-bottom:1rem"></p>
          <div class="ra-form-group">
            <label class="ra-form-label" for="cl-code">6-digit code</label>
            <input class="ra-form-input" id="cl-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" />
          </div>
          <div class="d-flex justify-content-between mb-3" style="font-size:0.88rem">
            <a href="#" id="cl-back" style="color:#00373e">Use a different email</a>
            <a href="#" id="cl-resend" style="color:#00373e">Resend code</a>
          </div>
        </div>
        <p id="cl-msg" class="ra-form-alert error" role="alert" hidden></p>
        <button type="submit" class="ra-btn-submit" id="cl-submit">Send code</button>
        <div class="text-center mt-3">
          <a href="index.html" style="color: #00373e; font-size: 0.88rem; text-decoration: none; font-weight: 500; opacity: 0.8; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.8'">← Back to Website</a>
        </div>
      </form>
    </section>
  </main>

  <div style="margin-bottom: 5rem;"></div>

  <script src="js/common.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var form = $("customerLoginForm"), email = $("cl-email"), code = $("cl-code"),
          msg = $("cl-msg"), btn = $("cl-submit"), step = 1, cool = 0, timer = null;

      function show(text, ok) {
        msg.textContent = text || "";
        msg.className = "ra-form-alert " + (ok ? "success" : "error");
        msg.hidden = !text;
      }
      function post(url, data) {
        return fetch(url, { method: "POST", body: new URLSearchParams(data) })
          .then(function (r) { return r.json().catch(function () { return { success: false, error: "Unexpected response." }; }); })
          .catch(function () { return { success: false, error: "Network error. Please try again." }; });
      }
      function setStep(n) {
        step = n;
        $("cl-step-email").hidden = n !== 1;
        $("cl-step-code").hidden = n !== 2;
        btn.textContent = n === 1 ? "Send code" : "Verify & sign in";
        show("");
        (n === 1 ? email : code).focus();
      }
      function startCooldown() {
        cool = 60; clearInterval(timer);
        var link = $("cl-resend");
        (function tick() {
          link.textContent = cool > 0 ? "Resend code (" + cool + "s)" : "Resend code";
          link.style.pointerEvents = cool > 0 ? "none" : "";
          link.style.opacity = cool > 0 ? "0.5" : "";
          if (cool-- > 0) timer = setTimeout(tick, 1000);
        })();
      }
      function requestCode(isResend) {
        btn.disabled = true;
        return post("api/client-otp-request.php", { email: email.value.trim() }).then(function (d) {
          btn.disabled = false;
          if (!d.success) { show(d.error || "Could not send a code."); return; }
          $("cl-sent").textContent = "If that email is registered, a code has been sent to " + email.value.trim() + ".";
          if (!isResend) setStep(2);
          code.value = "";
          startCooldown();
          if (isResend) show("A new code has been sent if that email is registered.", true);
          if (d.dev_code) show("Dev mode: your code is " + d.dev_code, true);
        });
      }

      code.addEventListener("input", function () { code.value = code.value.replace(/\D/g, "").slice(0, 6); });
      $("cl-back").addEventListener("click", function (e) { e.preventDefault(); setStep(1); });
      $("cl-resend").addEventListener("click", function (e) { e.preventDefault(); if (cool <= 0) requestCode(true); });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (step === 1) {
          if (!email.value.trim() || !email.checkValidity()) { show("Please enter a valid email address."); return; }
          requestCode(false);
          return;
        }
        if (!/^\d{6}$/.test(code.value)) { show("Enter the 6-digit code from your email."); return; }
        btn.disabled = true;
        post("api/client-otp-verify.php", { email: email.value.trim(), code: code.value }).then(function (d) {
          if (d.success) { location.href = d.redirect || "portal/index.php"; return; }
          btn.disabled = false;
          show(d.error || "That code is invalid or has expired.");
        });
      });
    })();
  </script>
</body>

</html>
